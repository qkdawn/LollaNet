[project]
name = "lollanet-cma-qualification"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate>=1.10,<2",
  "bitsandbytes>=0.48,<1",
  "huggingface-hub>=0.34,<1",
  "numpy>=2,<3",
  "pyyaml>=6,<7",
  "scipy>=1.14,<2",
  "torch>=2.5,<3",
  "transformers>=4.57,<5",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
