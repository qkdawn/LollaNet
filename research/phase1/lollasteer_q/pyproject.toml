[project]
name = "lollasteer-q-pilot"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate>=1.0,<2",
  "datasets>=3.0,<5",
  "numpy>=1.26,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "torch>=2.5,<3",
  "transformers>=4.47,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
